<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cài App Sideload - ESign, Scarlet, Feather</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #09090b 100%);
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary-glow: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --primary-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      --success-color: #10b981;
      --error-color: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Ambient Glow background elements */
    .orb {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }
    .orb-1 {
      top: 10%;
      left: 10%;
      background: #6366f1;
    }
    .orb-2 {
      bottom: 10%;
      right: 10%;
      background: #d946ef;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #a855f7, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
      font-weight: 400;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #cbd5e1;
    }

    /* Custom Radio Grid */
    .app-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }

    .app-card {
      cursor: pointer;
      position: relative;
      width: calc(33.333% - 8px);
      min-width: 130px;
    }

    @media (max-width: 480px) {
      .app-card {
        width: calc(50% - 6px);
      }
    }

    .app-card input {
      display: none;
    }

    .app-card span {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-main);
      font-weight: 600;
      font-size: 14px;
      transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .app-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }

    .app-card span:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .app-card input:checked + span {
      background: var(--primary-glow);
      border-color: transparent;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      color: #fff;
    }

    /* Custom File Input Zone */
    .file-input-wrapper {
      position: relative;
      width: 100%;
    }

    .file-dummy {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.01);
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .file-dummy:hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.05);
      color: var(--text-main);
    }

    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    /* Password Input styling */
    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-main);
      font-size: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    /* Styled Button */
    button, .btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      background: var(--primary-glow);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 24px;
      text-align: center;
      transition: background-color 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover, .btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
      transform: translateY(-1px);
    }

    button:active, .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    .footer-note {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      margin-top: 20px;
      line-height: 1.6;
    }

    .footer-note b {
      color: #cbd5e1;
    }

    /* Result styling */
    .result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
      animation: fadeIn 0.4s ease;
    }

    .error { 
      color: var(--error-color); 
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .success { 
      color: var(--success-color); 
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .links a {
      color: #a855f7;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      margin-top: 10px;
      transition: color 0.2s ease;
    }

    .links a:hover {
      color: #c084fc;
      text-decoration: underline;
    }

    .small-link {
      margin-top: 12px;
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-all;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .note-text {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      margin-top: 4px;
      font-weight: 500;
    }

    /* Loading Spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    .loading-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 10px 0;
      color: var(--text-muted);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body {
        padding: 12px;
      }
      .wrap {
        padding: 20px 16px;
        border-radius: 16px;
      }
      h1 {
        font-size: 24px;
      }
      .subtitle {
        font-size: 13px;
        margin-bottom: 20px;
      }
      .app-card {
        width: calc(50% - 6px);
      }
      .app-card span {
        padding: 10px;
        font-size: 13px;
        border-radius: 10px;
      }
      .app-icon {
        width: 20px;
        height: 20px;
      }
      .file-dummy {
        padding: 12px;
        font-size: 13px;
      }
      button, .btn {
        padding: 12px;
        font-size: 14px;
        margin-top: 16px;
      }
    }
  </style>
</head>

      <label>Mật Khẩu Chứng Chỉ P12</label>
      <input type="password" name="p12pass" placeholder="Nhập mật khẩu file p12" required>

      <button type="submit" id="submitBtn">
        <span>Ký & Tạo Link Cài Đặt</span>
      </button>
    </form>

    <p class="footer-note">
      Sau khi ký hoàn tất, vui lòng mở liên kết bằng <b>Safari trên iPhone/iPad</b> để tiến hành cài đặt.
    </p>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    const form = document.getElementById("signForm");
    const result = document.getElementById("result");
    const fileInput = document.getElementById("certzip");
    const fileDummy = document.getElementById("fileDummy");
    const fileNameText = document.getElementById("fileNameText");
    const submitBtn = document.getElementById("submitBtn");

    // Display selected file name
    fileInput.addEventListener("change", (e) => {
      if (fileInput.files.length > 0) {
        fileNameText.innerText = fileInput.files[0].name;
        fileDummy.style.borderColor = "#10b981";
        fileDummy.style.background = "rgba(16, 185, 129, 0.05)";
      } else {
        fileNameText.innerText = "Kéo thả hoặc nhấp để chọn tệp ZIP";
        fileDummy.style.borderColor = "rgba(255, 255, 255, 0.15)";
        fileDummy.style.background = "rgba(255, 255, 255, 0.01)";
      }
    });

    function copyLink(link) {
      navigator.clipboard.writeText(link).then(() => {
        alert("Đã sao chép liên kết cài đặt!");
      }).catch(() => {
        prompt("Sao chép liên kết dưới đây:", link);
      });
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      // Update loading status
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner"></span> <span>Đang ký ứng dụng...</span>`;
      
      result.style.display = "block";
      result.innerHTML = `
        <div class="loading-container">
          <span class="spinner"></span>
          <span>Đang nạp ứng dụng mẫu, giải nén chứng chỉ và tiến hành ký...</span>
        </div>
      `;

      try {
        const formData = new FormData(form);

        const res = await fetch("/sign", {
          method: "POST",
          body: formData
        });

        const text = await res.text();
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          result.innerHTML = `<div class="error">❌ Lỗi: ${text}</div>`;
          resetSubmitBtn();
          return;
        }

        if (!res.ok || !data.success) {
          result.innerHTML = `<div class="error">❌ ${data.error || "Quá trình ký thất bại."}</div>`;
          resetSubmitBtn();
          return;
        }

        result.innerHTML = `
          <div class="success">✓ Ký thành công: ${data.app}</div>
          <div class="links">
            <button class="btn" onclick="window.location.href='${data.install}'">Cài đặt app về máy</button>
            <button class="btn btn-secondary" onclick="copyLink('${data.install}')">📋 Sao chép liên kết</button>
            <div class="note-text">Gửi cho người khác để cài đặt</div>
          </div>
        `;
      } catch (err) {
        result.innerHTML = `<div class="error">❌ Có lỗi xảy ra trong quá trình kết nối đến máy chủ.</div>`;
      } finally {
        resetSubmitBtn();
      }
    });

    function resetSubmitBtn() {
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<span>Ký & Tạo Link Cài Đặt</span>`;
    }
  </script>
</body>
</html>
