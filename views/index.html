<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign IPA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      padding: 24px;
    }
    .wrap {
      max-width: 560px;
      margin: 40px auto;
      background: #111827;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 700;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .app-card {
      margin: 0;
      cursor: pointer;
    }
    .app-card input {
      display: none;
    }
    .app-card span {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #fff;
      text-align: center;
      font-weight: 700;
      transition: .2s;
    }
    .app-card input:checked + span {
      background: #2563eb;
      border-color: #2563eb;
    }
    input[type="file"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #fff;
    }
    button, .btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-top: 18px;
      text-align: center;
    }
    button:hover, .btn:hover {
      background: #1d4ed8;
    }
    .muted {
      color: #94a3b8;
      font-size: 14px;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #0b1220;
      border: 1px solid #1e293b;
      word-break: break-word;
    }
    .error { color: #fca5a5; }
    .success { color: #86efac; }
    .links a {
      color: #93c5fd;
      display: block;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Sign IPA</h1>
    <p>Chọn app có sẵn, upload ZIP cert và nhập mật khẩu p12.</p>

    <form id="signForm">
      <label>Chọn app Muốn Cài</label>
      <div class="app-grid">
        <label class="app-card">
          <input type="radio" name="app" value="esign" checked>
          <span>ESign</span>
        </label>

        <label class="app-card">
          <input type="radio" name="app" value="ksign">
          <span>KSign</span>
        </label>

        <label class="app-card">
          <input type="radio" name="app" value="gbox">
          <span>GBox</span>
        </label>

        <label class="app-card">
          <input type="radio" name="app" value="scarlet">
          <span>Scarlet</span>
        </label>
      </div>

      <label>File ZIP cert</label>
      <input type="file" name="certzip" accept=".zip" required>

      <label>Mật khẩu p12</label>
      <input type="password" name="p12pass" placeholder="Nhập mật khẩu p12" required>

      <button type="submit">Sign & Tạo link cài</button>
    </form>

    <p class="muted">
      ZIP chỉ cần chứa <b>.p12</b> và <b>.mobileprovision</b>.<br>
      Sau khi sign xong, hãy mở cài đặt bằng <b>Safari trên iPhone</b>.
    </p>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    const form = document.getElementById("signForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      result.style.display = "block";
      result.innerHTML = "Đang kiểm tra cache, tải app nếu thiếu, rồi sign...";

      try {
        const formData = new FormData(form);

        const res = await fetch("/sign", {
          method: "POST",
          body: formData
        });

        const text = await res.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch {
          result.innerHTML = `<div class="error">❌ ${text}</div>`;
          return;
        }

        if (!res.ok || !data.success) {
          result.innerHTML = `<div class="error">❌ ${data.error || "Sign thất bại."}</div>`;
          return;
        }

        result.innerHTML = `
          <div class="success">✅ Sign thành công: ${data.app}</div>
          <div class="links">
            <button class="btn" onclick="window.location.href='${data.install}'">Cài trực tiếp</button>
            <a href="${data.ipa}" target="_blank">Tải IPA đã sign</a>
            <a href="${data.plist}" target="_blank">Mở plist</a>
          </div>
        `;
      } catch (err) {
        result.innerHTML = `<div class="error">❌ Có lỗi khi sign.</div>`;
      }
    });
  </script>
</body>
</html>
