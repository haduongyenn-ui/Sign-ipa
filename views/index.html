<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPA Signer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      padding: 24px;
    }
    .wrap {
      max-width: 560px;
      margin: 40px auto;
      background: #111827;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: 700;
    }
    input[type="file"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #fff;
    }
    button, .btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      margin-top: 18px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    button:hover, .btn:hover {
      background: #1d4ed8;
    }
    .muted {
      color: #94a3b8;
      font-size: 14px;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #0b1220;
      border: 1px solid #1e293b;
      word-break: break-word;
    }
    .error {
      color: #fca5a5;
    }
    .success {
      color: #86efac;
    }
    .links a {
      color: #93c5fd;
      display: block;
      margin-top: 10px;
    }
    .meta {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #1e293b;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Web Sign IPA Online</h1>
    <p>Upload IPA + ZIP cert, nhập mật khẩu p12, rồi nhận link cài trực tiếp bằng itms-services.</p>

    <form id="signForm">
      <label>File IPA</label>
      <input type="file" name="ipa" accept=".ipa" required>

      <label>File ZIP cert</label>
      <input type="file" name="certzip" accept=".zip" required>

      <label>Mật khẩu p12</label>
      <input type="password" name="p12pass" placeholder="Nhập mật khẩu p12" required>

      <button type="submit">Sign IPA</button>
    </form>

    <p class="muted">
      File ZIP chỉ cần chứa <b>.p12</b> và <b>.mobileprovision</b>.<br>
      Bundle ID, tên app và version sẽ tự đọc từ IPA.<br>
      Sau khi sign xong, hãy mở nút cài bằng <b>Safari trên iPhone</b>.
    </p>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    const form = document.getElementById("signForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      result.style.display = "block";
      result.innerHTML = "Đang upload, phân tích IPA và sign...";

      try {
        const formData = new FormData(form);

        const res = await fetch("/sign", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          result.innerHTML = `<div class="error">❌ ${data.error || "Sign thất bại."}</div>`;
          return;
        }

        const meta = data.metadata || {};

        result.innerHTML = `
          <div class="success">✅ Sign thành công</div>
          <div class="links">
            <a class="btn" href="${data.install}">Cài trực tiếp</a>
            <a href="${data.ipa}" target="_blank">Tải file IPA đã sign</a>
            <a href="${data.plist}" target="_blank">Mở file plist</a>
          </div>
          <div class="meta">
            <div><b>Bundle ID:</b> ${meta.bundleId || "Không rõ"}</div>
            <div><b>Tên app:</b> ${meta.title || "Không rõ"}</div>
            <div><b>Version:</b> ${meta.version || "Không rõ"}</div>
          </div>
        `;
      } catch (err) {
        result.innerHTML = `<div class="error">❌ Có lỗi khi upload hoặc sign.</div>`;
      }
    });
  </script>
</body>
</html>
