<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPA Signer Online</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eceff1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #333; text-align: center; margin-bottom: 1.5rem; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #555; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #4caf50; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; margin-top: 20px; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #45a049; }
        .footer { text-align: center; margin-top: 15px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Ký IPA Online</h2>
        <form action="/sign" method="post" encType="multipart/form-data">
            <label>1. Tệp IPA gốc:</label>
            <input type="file" name="ipa" accept=".ipa" required>
            
            <label>2. Chứng chỉ (.p12):</label>
            <input type="file" name="p12" accept=".p12" required>
            
            <label>3. Mật khẩu P12:</label>
            <input type="password" name="password" placeholder="Bỏ trống nếu không có">
            
            <label>4. Mobile Provision:</label>
            <input type="file" name="prov" accept=".mobileprovision" required>
            
            <button type="submit">Bắt đầu ký & Tải về</button>
        </form>
        <div class="footer">Xử lý an toàn • Tự động xóa file sau khi ký</div>
    </div>
</body>
</html>
